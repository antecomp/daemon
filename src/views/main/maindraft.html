<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main-ui-layout-draft</title>
    <style>

@font-face {
  font-family: "main";
  src: url('@/assets/fonts/Piksel-JAGa.ttf');
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            color: white;
            image-rendering: pixelated;
            font-family: 'main';
        }

        #main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: grid;
            grid-template-columns: auto 941px;
            grid-template-rows: 611px 81px;
            gap: 2px 0px;
        }

        #sidebar {
                display: flex;

                border: solid white 2px;
                border-top: none;
                border-right: none;

                flex-direction: column;
                justify-content: center;
                align-items: center;


                .sidebar-button {
                    margin-top: -17px;
                    margin-bottom: -17px;
                }
        }

            #bottom-bar {
                display: flex;
                gap: 2px;

                #event-log {
                    border: solid 2px white;
                    flex-grow: 1;
                    padding: 5px;
                }
            }

            #scene-container {
                border: solid 2px white;
            }

            #sidebar::before{
                content: url('./assets/sidebar_top.png');
                position: absolute;
                top: 0;
                left: 0;
            }
    </style>
</head>
<body>
    <section id="main">
        <div id="sidebar">
            <img class="sidebar-button"  src="./assets/sidebar_button.png" alt="">
            <img class="sidebar-button"  src="./assets/sidebar_button.png" alt="">
            <img class="sidebar-button" src="./assets/sidebar_button_active.png" alt="">
        </div>
        <div id="scene-container">
            sfdkljskdlf
        </div>
        <img src="./assets/vl_badge.png" />
        <div id="bottom-bar">
            <div id="event-log">
                She is smoking a cigarette
            </div>
            <div id="imode-picker">
                <img src="./assets/ip_c.png" />
            </div>
        </div>
    </section>
</body>
</html>
