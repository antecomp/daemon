<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
        <!-- Define the triangle wave using a polygon -->
        <polygon id="triangleWave" points="0,0 50,0 100,50 150,0 200,50" fill="blue">
          <!-- Animate the height and width of the triangle wave -->
          <animate attributeName="points" dur="2s" repeatCount="indefinite"
                   values="0,0 50,0 100,50 150,0 200,50;
                          0,50 50,75 100,50 150,75 200,25;
                          0,0 50,0 100,50 150,0 200,50" />
        </polygon>
      </svg>
</body>
</html>
